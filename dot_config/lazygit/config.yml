disableStartupPopups: true
os:
  editPreset: "nvim"
gui:
  nerdFontsVersion: "3"
  showBottomLine: false
  showRandomTip: false
  border: single
  spinner:
    rate: 80
    frames:
      - "⠋"
      - "⠙"
      - "⠹"
      - "⠸"
      - "⠼"
      - "⠴"
      - "⠦"
      - "⠧"
      - "⠇"
      - "⠏"
  theme:
    activeBorderColor:
      - "#5aaacc"
      - "bold"
    inactiveBorderColor:
      - "#635e7f"
    selectedLineBgColor:
      - "#2a3449"
    defaultFgColor:
      - "#cdcae4"
